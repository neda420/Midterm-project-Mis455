<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Product Store</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Md Nadimul Islam, ID: 2222063 -->
  <header>
    <div class="navbar">
      <h1>Product Store</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <h2>Contact Us</h2>
    <div class="contact-wrapper">
      <div class="contact-info">
        <img src="Photots/Contact.png" alt="Contact Us">
        <p><strong>Email:</strong> Productshop@gmail.com</p>
        <p><strong>Phone:</strong> +880 183691 8742</p>
        <p><strong>Address:</strong> 123 Market Street, Dhaka, Bangladesh</p>
      </div>
      <form id="contact-form" class="contact-form" novalidate>
        <h3>Send Us a Message</h3>
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
          <span class="error-msg" id="name-error"></span>
        </div>
        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
          <span class="error-msg" id="email-error"></span>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="How can we help?">
        </div>
        <div class="form-group">
          <label for="message">Message <span class="required">*</span></label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
          <span class="error-msg" id="message-error"></span>
        </div>
        <button type="submit">Send Message</button>
        <p id="form-success" class="form-success" style="display:none;">Thank you! Your message has been sent.</p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Product Store. All rights reserved. | Md Nadimul Islam, ID: 2222063</p>
  </footer>
</body>
</html>
